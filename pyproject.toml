[project]
name = "pr-lens"
version = "0.1.0"
description = "Opt-in GitHub App that leaves line-level review comments on pull requests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_lens"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "T20",       # no print
    "SIM",       # simplify
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit
]
ignore = ["S101"]  # pytest needs assert

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fixture secrets are not credentials

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
