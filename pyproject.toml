[project]
name = "pr-lens"
version = "0.1.0"
description = "Opt-in GitHub App that leaves line-level review comments on pull requests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The receiver's dependencies, and only those. This list is what gets installed on
# Vercel, so anything added here ships to the serverless path. Postgres deliberately is
# not here: the receiver must not be able to open a database connection.
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_lens"]

[dependency-groups]
# Needed by the Actions jobs that write to Neon, never by the receiver.
db = ["asyncpg>=0.30"]

# The mining job's extras. huggingface-hub is here rather than in the project's
# dependencies so the receiver's closure stays three packages wide.
ingest = ["huggingface-hub>=0.26"]

# Phase 2 retrieval and the recall table. Everything here runs on the Actions runner,
# because no hosted embedding API is a permanent free tier. torch comes from the CPU
# index on Linux: the default PyPI wheel drags in about 3 GB of CUDA libraries that a
# runner with no GPU would download on every run.
retrieval = [
    "numpy>=2.1",
    "scipy>=1.14",
    "sentence-transformers>=5.0",
    "torch>=2.8",
    "pyarrow>=18",
]

dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "uvicorn[standard]>=0.32",
    { include-group = "db" },
    { include-group = "ingest" },
    { include-group = "retrieval" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "T20",       # no print
    "SIM",       # simplify
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit
]
ignore = ["S101"]  # pytest needs assert

[tool.ruff.lint.per-file-ignores]
# Fixture secrets are not credentials, and a test reading a temp file it just wrote does
# not need async file IO.
# Fixture secrets are not credentials; a test reading a temp file it just wrote does not
# need async file IO; and the one subprocess call runs this interpreter on a literal.
"tests/*" = ["S105", "S106", "ASYNC240", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "huggingface_hub.*",
    "sentence_transformers.*",
    "scipy.*",
    "pyarrow.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
