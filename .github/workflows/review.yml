name: review

# Started by the receiver once a pull request event has passed HMAC verification. This is
# where the database lives: the receiver is stateless, so the first thing this job does is
# write the delivery row.
on:
  repository_dispatch:
    types: [pr_event]

permissions:
  contents: read

concurrency:
  # Two pushes to one pull request fire two deliveries with two different ids, and the
  # deliveries primary key only stops a redelivery of the same id. Without this group both
  # runs review the pull request, which at Phase 4 is two comments on one line. The newest
  # head is the one worth reviewing, so the older run is cancelled.
  #
  # The cost, accepted: a manual redelivery that lands while its own original run is still
  # going cancels that run, and the redelivery then skips as already recorded. That pull
  # request gets no review. Silence is a valid output; a duplicate comment is not.
  # Cancelling cannot un-post a comment already sent, which is what the posted_comments
  # ledger is for: its row is taken before each comment is posted.
  group: review-${{ github.event.client_payload.repo_full_name }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  review:
    runs-on: ubuntu-latest
    # Fetch, one retrieval index, two inference calls with room for the per-minute token
    # window to roll over, and at most three posts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --no-dev --group db --group ingest --group retrieval

      - name: Record the delivery
        id: record
        # Through env, never interpolated into the script. client_payload arrives from the
        # public internet and ${{ }} inside a run block is a shell injection.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: uv run --no-dev python -m pr_lens.jobs.record_delivery

      - name: Skipped as a redelivery
        if: steps.record.outputs.new != 'true'
        run: echo "This delivery was already recorded. Nothing to do."

      # An installation token for the one repository under review, able to read its code
      # and write pull request comments and nothing else. Contents stays read, which is
      # what makes "never pushes" true at the credential. The owner and name come from
      # record_delivery's outputs, which it checks against GitHub's name rules, and reach
      # the action as inputs, never through a shell.
      - name: Mint the installation token
        id: token
        if: steps.record.outputs.new == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # app-id is deprecated in v3 in favour of client-id. It still works, and the App's
          # client id is not yet a secret here. Switching is a one-line change.
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.record.outputs.owner }}
          repositories: ${{ steps.record.outputs.repo_name }}
          permission-contents: read
          permission-pull-requests: write

      # The model weights only, named. Never the whole hub cache, which also holds the
      # private corpus shards this job downloads, and caches on a public repo can be
      # restored by pull request workflows.
      - uses: actions/cache@v4
        if: steps.record.outputs.new == 'true'
        with:
          path: ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-modernbert-base
          key: hf-models-gte-${{ hashFiles('src/pr_lens/retrieval/embed.py') }}

      - name: Review the pull request
        # GitHub redelivers webhooks, and the receiver holds no state to notice. The row
        # written above is the guard: a delivery id we have already seen stops above
        # rather than commenting on the same pull request twice.
        if: steps.record.outputs.new == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GH_INSTALLATION_TOKEN: ${{ steps.token.outputs.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run --no-dev python -m pr_lens.jobs.review
