name: review

# Started by the receiver once a pull request event has passed HMAC verification. This is
# where the database lives: the receiver is stateless, so the first thing this job does is
# write the delivery row.
on:
  repository_dispatch:
    types: [pr_event]

permissions:
  contents: read

concurrency:
  # Two pushes to one pull request fire two deliveries with two different ids, and the
  # deliveries primary key only stops a redelivery of the same id. Without this group both
  # runs review the pull request, which at Phase 4 is two comments on one line. The newest
  # head is the one worth reviewing, so the older run is cancelled.
  #
  # The cost, accepted: a manual redelivery that lands while its own original run is still
  # going cancels that run, and the redelivery then skips as already recorded. That pull
  # request gets no review. Silence is a valid output; a duplicate comment is not.
  # Cancelling cannot un-post a comment already sent, which is what the Phase 4 ledger is for.
  group: review-${{ github.event.client_payload.repo_full_name }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Record the delivery
        id: record
        # Through env, never interpolated into the script. client_payload arrives from the
        # public internet and ${{ }} inside a run block is a shell injection.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: uv run python -m pr_lens.jobs.record_delivery

      - name: Review the pull request
        # GitHub redelivers webhooks, and the receiver holds no state to notice. The row
        # written above is the guard: a delivery id we have already seen stops here rather
        # than commenting on the same pull request twice.
        if: steps.record.outputs.new == 'true'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "Phase 0 stub. Phases 1 to 4 replace this with the real review run."
          echo "$PAYLOAD"

      - name: Skipped as a redelivery
        if: steps.record.outputs.new != 'true'
        run: echo "This delivery was already recorded. Nothing to do."
