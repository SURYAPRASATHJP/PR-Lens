name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # A throwaway container, not Neon. Neon free is 0.5 GB with a 100 CU-hour budget and
    # every CI run against it spends the production database's quota.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest

      - name: requirements.txt matches the lockfile
        # Vercel installs from requirements.txt, not from uv.lock. If they drift, the
        # deployed receiver runs versions nothing here ever tested.
        run: |
          set -euo pipefail
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt \
            --no-color 2>/dev/null | grep -vE '^\s*(#|$)' > /tmp/expected.txt
          grep -vE '^\s*(#|$)|^\.$' requirements.txt > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt || {
            echo "requirements.txt is stale. Regenerate it, see README."
            exit 1
          }
