name: keepalive

# HF Space CPU Basic sleeps after 48 hours idle, and a cold start can outrun GitHub's
# 10 second webhook timeout. GitHub does not retry a failed delivery, so a sleeping Space
# silently loses pull requests. This is a workaround for a free-tier limit, not a design.
on:
  schedule:
    # Every six hours. GitHub disables scheduled workflows after 60 days with no repo
    # activity, and it does not tell you. If deliveries start going missing, check here
    # first and re-enable it.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        # A repository variable, not a constant in code. The Space URL also lives in the
        # GitHub App settings, and the two have to agree.
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SPACE_URL:-}" ]; then
            echo "Repository variable SPACE_URL is not set. Add it once the Space exists."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                 --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
                 "${SPACE_URL%/}/health")
          echo "GET ${SPACE_URL%/}/health -> $code"
          test "$code" = "200"
