name: deploy

# Spaces build from their own repo on huggingface.co, not from GitHub, so main has to be
# mirrored across. Runs only after ci is green on main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write the Space card
        # Generated at deploy time rather than checked in. On GitHub a README carrying
        # YAML frontmatter renders as a metadata table above the actual readme.
        run: |
          set -euo pipefail
          {
            echo "---"
            echo "title: PR-Lens"
            echo "emoji: 🔍"
            echo "colorFrom: gray"
            echo "colorTo: blue"
            echo "sdk: docker"
            echo "app_port: 7860"
            echo "pinned: false"
            echo "---"
            echo
            echo "Webhook receiver for PR-Lens. Verifies the signature, records the"
            echo "delivery, and hands the work to GitHub Actions. Source lives on GitHub."
          } > README.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet huggingface_hub

      - name: Upload to the Space
        # The hub API rather than a git remote. It needs no local clone of the Space, does
        # not rewrite its history, and the token never lands in a remote URL.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in HF_TOKEN HF_USER HF_SPACE; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not set. See notes/phase-0-checklist.md."
              exit 1
            fi
          done
          python .github/scripts/deploy_space.py
